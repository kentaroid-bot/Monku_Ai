<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MonkuAi favicon</title>
  <desc id="desc">A dark gradient favicon with a white Cinzel M.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;display=swap");
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101112" />
      <stop offset="46%" stop-color="#121423" />
      <stop offset="100%" stop-color="#24127a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <text
    x="256"
    y="322"
    fill="#fffdfa"
    font-family="Cinzel, Georgia, 'Times New Roman', serif"
    font-size="438"
    font-weight="600"
    letter-spacing="0.08em"
    text-anchor="middle"
    dominant-baseline="middle"
  >M</text>
</svg>
