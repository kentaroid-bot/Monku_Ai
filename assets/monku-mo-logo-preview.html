<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monku.ai Mo Logo Concept</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Shippori+Mincho:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fffdfa;
        --ink: #121314;
        --muted: rgba(18, 19, 20, 0.58);
        --accent: #d99a43;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f4efe8;
        color: var(--ink);
      }

      .board {
        display: grid;
        gap: 28px;
        width: min(920px, calc(100vw - 40px));
        padding: 56px;
      }

      .mark-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
      }

      .symbol {
        width: 240px;
        height: 240px;
      }

      .wordmark {
        font-family: "Cinzel", Georgia, serif;
        font-size: 54px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .caption {
        max-width: 620px;
        margin: 0 auto;
        color: var(--muted);
        font-family: "Shippori Mincho", serif;
        font-size: 17px;
        line-height: 1.9;
        text-align: center;
      }

      .dot {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="board">
      <div class="mark-row">
        <svg class="symbol" viewBox="0 0 512 512" aria-label="monku.ai mo symbol">
          <rect width="512" height="512" rx="88" fill="#fffdfa" />
          <path
            d="M332 94
               C293 85 260 96 238 126
               C216 156 215 195 238 211
               C265 230 309 211 344 176
               C360 160 376 151 397 154
               M326 96
               C288 145 257 197 232 256
               C204 321 191 389 224 429
               C254 465 319 464 348 426
               C377 388 373 305 366 247
               C359 184 344 132 310 104
               M190 257
               C224 245 262 247 303 252"
            fill="none"
            stroke="#121314"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div class="wordmark">MONKU<span class="dot">.</span>AI</div>
      </div>
      <p class="caption">
        Noise may already be the answer.
      </p>
    </main>
  </body>
</html>
