name = "monku-ai"
main = "src/worker.js"
compatibility_date = "2026-08-03"
workers_dev = true

routes = [
  { pattern = "monku.ai", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/docs", "/docs/*", "/roadmap", "/roadmap/*", "/statement", "/statement/*"]

[vars]
CONTACT_TO = "renraku@monku.ai"
CONTACT_FROM = "MonkuAi <contact@send.monku.ai>"
